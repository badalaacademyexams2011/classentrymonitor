<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b6e4a">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e3d2a">
  <script>
    (function () {
      var theme = '';
      try { theme = localStorage.getItem('class-entry-theme') || ''; }
      catch (error) { console.warn('Could not read saved theme preference.', error); }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Class Entry Monitor</title>
  <style>
    #boot{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .35s}
    #boot.done{opacity:0;pointer-events:none}
    #boot img{width:min(46vw,200px);height:auto}
    #boot .bar{width:min(46vw,200px);height:4px;border-radius:4px;background:#e3ece6;overflow:hidden;position:relative}
    #boot .bar::after{content:"";position:absolute;inset:0 auto 0 -40%;width:40%;background:#1b6e4a;border-radius:4px;animation:bootslide 1.1s ease-in-out infinite}
    @keyframes bootslide{to{left:100%}}
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot"><img src="logo.png" alt="Badala Academy" onerror="this.onerror=null;this.src='icon-192.png'"><div class="bar"></div></div>
  <section id="login" hidden>
    <button id="themeToggleLogin" class="theme-toggle theme-toggle-login" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><span aria-hidden="true">☾</span></button>
    <div class="login-box">
      <img class="login-logo" src="logo.png" alt="School logo" onerror="this.onerror=null;this.src='icon-192.png'">
      <h1>Class Entry Monitor</h1>
      <p class="muted">Sign in to download the timetable. You need internet for this first time only.</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" maxlength="12">
      <button id="loginBtn" class="primary">Sign in</button>
      <p id="loginErr" class="err"></p>
      <button id="installBtn1" class="link" hidden>Install app on this phone</button>
    </div>
  </section>

  <section id="picker" hidden>
    <header class="top">
      <div>
        <div id="pkTitle" class="date"></div>
        <div id="pkDate" class="sub"></div>
      </div>
      <div class="top-actions">
        <button id="pkBadge" class="badge" aria-label="Sync status" aria-live="polite" aria-atomic="true"></button>
        <button id="themeTogglePicker" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><span aria-hidden="true">☾</span></button>
      </div>
    </header>
    <div class="pkwrap">
      <h2>Choose a section</h2>
      <div id="pkList"></div>
    </div>
  </section>

  <section id="main" hidden>
    <div class="stick">
    <header class="top">
      <div>
        <div id="hdrDate" class="date"></div>
        <div id="hdrUser" class="sub"></div>
        <button id="secBtn" class="secbtn" hidden></button>
      </div>
      <div class="top-actions">
        <button id="syncBadge" class="badge" aria-label="Sync status" aria-live="polite" aria-atomic="true"></button>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><span aria-hidden="true">☾</span></button>
      </div>
    </header>
    <div id="clockWarn" class="clockwarn" hidden></div>
    <div id="frozenWarn" class="clockwarn frozenwarn" hidden></div>
    <nav class="tabs">
      <button data-tab="entry" class="on">Entry</button>
      <button data-tab="today">Today</button>
      <button data-tab="reports" id="reportsTab">Reports</button>
      <button data-tab="clashes" id="clashesTab">Clashes</button>
      <button data-tab="admin" id="adminTab" hidden>Admin</button>
    </nav>
    </div>
    <div id="entryView">
      <div class="entry-datebar"><label for="entryDate">Entry date</label><input id="entryDate" type="date" aria-describedby="pastEntryWarn"></div>
      <div id="pastEntryWarn" class="past-entry-warn" role="status" hidden>⚠ Correcting a past day. Check the date and period before saving; changes will sync to school records.</div>
      <div id="periodBar" class="periods"></div>
      <div class="bar2">
        <span id="periodInfo"></span>
        <label class="chk"><input type="checkbox" id="unmarkedOnly"> Unmarked only</label>
      </div>
      <main id="list"></main>
    </div>
    <div id="todayView" hidden></div>
    <div id="reportsView" hidden></div>
    <div id="clashesView" hidden></div>
    <div id="adminView" hidden></div>
  </section>

  <div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="config.js"></script>
  <script src="core.js"></script>
  <script src="admin.js"></script>
  <script src="reports.js"></script>
  <script src="clashes.js"></script>
  <script src="app.js"></script>
</body>
</html>
